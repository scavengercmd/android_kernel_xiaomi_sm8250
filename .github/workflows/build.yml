name: PROJECT LUCY Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@v1.10.1
        with:
          kernel-url: https://github.com/YOUR_USERNAME/android_kernel_xiaomi_sm8250
          kernel-branch: lineage-23.2

          kernel-dir: kernel
          arch: arm64
          config: munch_defconfig
          depth: 1

          # ----------------------------
          # TOOLCHAIN (FIXED)
          # ----------------------------
          aosp-clang: true
          aosp-gcc: true
          aosp-clang-version: r383902b1

          # ----------------------------
          # VENDOR (SAFER OFF)
          # ----------------------------
          vendor: false

          # ----------------------------
          # KERNELSU (OFF TO AVOID BREAKS)
          # ----------------------------
          ksu: false
          ksu-version: main
          ksu-lkm: false
          ksu-other: false

          # ----------------------------
          # OPTIONAL FEATURES OFF (STABILITY)
          # ----------------------------
          rekernel: false
          nethunter: false
          nethunter-patch: false
          lxc: false
          lxc-patch: false
          kvm: false
          bbg: false

          # ----------------------------
          # BUILD OPTS
          # ----------------------------
          disable-lto: false
          ccache: true
          release: true

          # REQUIRED TOKEN
          access-token: ${{ secrets.GITHUB_TOKEN }}

          # IMPORTANT: must be string, not empty array
          extra-make-args: ""
