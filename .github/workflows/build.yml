name: Project Lucy
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          # Required to allow subsequent git commands to authenticate
          persist-credentials: true
          # Uncomment and add if your repository is private:
          # token: ${{ secrets.GH_PAT }}

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/YOUR_USERNAME/android_kernel_xiaomi_sm8250
          kernel-branch: lineage-23.2
          config: munch_defconfig
          arch: arm64
          anykernel3: true
          # Ensure these match your specific build needs
          aosp-gcc: true
          aosp-clang: true
