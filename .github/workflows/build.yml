name: Project Lucy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex zip curl build-essential libssl-dev libelf-dev python3

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Set environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Verify defconfig exists
        run: |
          ls arch/arm64/configs || true

      - name: Build kernel
        run: |
          mkdir -p out
          make O=out munch_defconfig
          make -j$(nproc) O=out CC=clang LLVM=1 LLVM_IAS=1

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLucy-Kernel
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/Image.gz*
