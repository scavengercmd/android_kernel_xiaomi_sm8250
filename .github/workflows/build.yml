name: PROJECT LUCY Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (not strictly needed by action but safer)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@v1.10.1

        with:
          kernel-url: https://github.com/YOUR_USERNAME/android_kernel_xiaomi_sm8250
          kernel-branch: lineage-23.2

          config: munch_defconfig
          arch: arm64
          kernel-dir: kernel

          depth: 1

          # ------------------------
          # TOOLCHAIN (KEEP SIMPLE)
          # ------------------------
          aosp-clang: true
          aosp-gcc: false

          aosp-clang-version: r383902b1

          # ------------------------
          # VENDOR (DISABLED CLEANLY)
          # ------------------------
          vendor: false

          # ------------------------
          # FEATURES (ALL OFF FOR STABILITY)
          # ------------------------
          ksu: false
          ksu-version: main
          ksu-lkm: false
          ksu-other: false

          rekernel: false
          nethunter: false
          nethunter-patch: false
          lxc: false
          lxc-patch: false
          kvm: false
          bbg: false

          disable-lto: false
          ccache: true
          release: true

          # ------------------------
          # SECURITY TOKEN
          # ------------------------
          access-token: ${{ secrets.GITHUB_TOKEN }}

          # FIX: remove empty array (causes YAML parsing issues in some runners)
          extra-make-args: ""
